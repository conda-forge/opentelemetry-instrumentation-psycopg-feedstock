schema_version: 1

context:
  version: 0.64b0

package:
  name: opentelemetry-instrumentation-psycopg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-psycopg/opentelemetry_instrumentation_psycopg-${{ version }}.tar.gz
  sha256: e9f41fad425183392d97068dbe2ce6e938514520312cfd7bf409242bd800c013

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-instrumentation-dbapi ==${{ version }}
    - psycopg >=3.1.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.psycopg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry psycopg instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-psycopg

extra:
  recipe-maintainers:
    - BrownMunda1
